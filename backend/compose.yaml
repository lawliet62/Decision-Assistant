services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: decision_assistant
      POSTGRES_PASSWORD: decision_assistant
      POSTGRES_USER: decision_assistant
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decision_assistant -d decision_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

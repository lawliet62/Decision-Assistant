spring:
  application:
    name: decision-assistant-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/decision_assistant}
    username: ${DB_USERNAME:decision_assistant}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  ai:
    model:
      chat: none # Selected by the secret bootstrap only when AI is enabled.
    openai:
      api-key: disabled
      chat:
        model: ${OPENAI_MODEL:gpt-5.4-nano}
        store: false
    google:
      genai:
        api-key: disabled
        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s

decision-assistant:
  catalog:
    enabled: ${DECISION_ASSISTANT_CATALOG_ENABLED:true}
    refresh-enabled: ${DECISION_ASSISTANT_CATALOG_REFRESH_ENABLED:false}
    manifest: ${DECISION_ASSISTANT_CATALOG_MANIFEST:classpath:catalog/earbuds.json}
    monthly-limit: ${DECISION_ASSISTANT_CATALOG_MONTHLY_LIMIT:200}
  secrets:
    mode: ${DECISION_ASSISTANT_SECRETS_MODE:gcp}
    dev-project-id: ${DECISION_ASSISTANT_SECRETS_DEV_PROJECT_ID:}
    prod-project-id: ${DECISION_ASSISTANT_SECRETS_PROD_PROJECT_ID:}
    versions:
      gemini-api-key: ${GEMINI_SECRET_VERSION:}
      openai-api-key: ${OPENAI_SECRET_VERSION:}
      serper-api-key: ${SERPER_SECRET_VERSION:}
      firecrawl-api-key: ${FIRECRAWL_SECRET_VERSION:}
      resend-api-key: ${RESEND_SECRET_VERSION:}
      auth0-client-secret: ${AUTH0_SECRET_VERSION:}
      db-password: ${DB_SECRET_VERSION:}
  auth:
    allowed-emails: ${DECISION_ASSISTANT_ALLOWED_EMAILS:}
    public-base-url: ${DECISION_ASSISTANT_PUBLIC_BASE_URL:http://localhost:3000}
  ai:
    enabled: ${DECISION_ASSISTANT_AI_ENABLED:false}
    provider: ${DECISION_ASSISTANT_AI_PROVIDER:gemini}
    model: ${DECISION_ASSISTANT_AI_MODEL:${GEMINI_MODEL:gemini-3.5-flash-lite}}
    timeout: 30s
  web:
    enabled: ${DECISION_ASSISTANT_WEB_ENABLED:false}
    base-url: ${FIRECRAWL_BASE_URL:https://api.firecrawl.dev/v2}
    api-key: disabled
    timeout: 45s
  search:
    enabled: ${DECISION_ASSISTANT_SEARCH_ENABLED:false}
    api-key: disabled
    monthly-limit: ${DECISION_ASSISTANT_SEARCH_MONTHLY_LIMIT:1000}
  reminders:
    enabled: ${DECISION_ASSISTANT_REMINDERS_ENABLED:false}
    resend-base-url: ${RESEND_BASE_URL:https://api.resend.com}
    resend-api-key: disabled
    from-address: ${DECISION_ASSISTANT_FROM_EMAIL:Decision Assistant <reminders@example.com>}

springdoc:
  api-docs:
    path: /api/openapi

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: DECISION_ASSISTANT_SESSION
        http-only: true
        secure: true
        same-site: lax
        max-age: 7d

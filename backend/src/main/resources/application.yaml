spring:
  application:
    name: decision-assistant-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/decision_assistant}
    username: ${DB_USERNAME:decision_assistant}
    password: ${DB_PASSWORD:decision_assistant}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:google-genai}
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      chat:
        model: ${OPENAI_MODEL:gpt-5.4-nano}
        store: false
    google:
      genai:
        api-key: ${GEMINI_API_KEY:disabled}
        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s

decision-assistant:
  ai:
    enabled: ${DECISION_ASSISTANT_AI_ENABLED:true}
    provider: ${DECISION_ASSISTANT_AI_PROVIDER:gemini}
    model: ${DECISION_ASSISTANT_AI_MODEL:${GEMINI_MODEL:gemini-3.5-flash-lite}}
    timeout: 30s

springdoc:
  api-docs:
    path: /api/openapi

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: decision-assistant-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/decision_assistant}
    username: ${DB_USERNAME:decision_assistant}
    password: ${DB_PASSWORD:decision_assistant}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:google-genai}
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      chat:
        model: ${OPENAI_MODEL:gpt-5.4-nano}
        store: false
    google:
      genai:
        api-key: ${GEMINI_API_KEY:disabled}
        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s

decision-assistant:
  auth:
    allowed-emails: ${DECISION_ASSISTANT_ALLOWED_EMAILS:}
    public-base-url: ${DECISION_ASSISTANT_PUBLIC_BASE_URL:http://localhost:3000}
  ai:
    enabled: ${DECISION_ASSISTANT_AI_ENABLED:true}
    provider: ${DECISION_ASSISTANT_AI_PROVIDER:gemini}
    model: ${DECISION_ASSISTANT_AI_MODEL:${GEMINI_MODEL:gemini-3.5-flash-lite}}
    timeout: 30s
  web:
    enabled: ${DECISION_ASSISTANT_WEB_ENABLED:false}
    base-url: ${FIRECRAWL_BASE_URL:https://api.firecrawl.dev/v2}
    api-key: ${FIRECRAWL_API_KEY:disabled}
    timeout: 45s
  search:
    enabled: ${DECISION_ASSISTANT_SEARCH_ENABLED:false}
    api-key: ${SERPER_API_KEY:disabled}
    monthly-limit: ${DECISION_ASSISTANT_SEARCH_MONTHLY_LIMIT:1000}
  reminders:
    enabled: ${DECISION_ASSISTANT_REMINDERS_ENABLED:false}
    resend-base-url: ${RESEND_BASE_URL:https://api.resend.com}
    resend-api-key: ${RESEND_API_KEY:disabled}
    from-address: ${DECISION_ASSISTANT_FROM_EMAIL:Decision Assistant <reminders@example.com>}

springdoc:
  api-docs:
    path: /api/openapi

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: DECISION_ASSISTANT_SESSION
        http-only: true
        secure: true
        same-site: lax
        max-age: 7d

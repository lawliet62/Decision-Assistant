name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step names belong to the immutable job attempt, unlike mutable PR data in run.pull_requests.
      - name: Restack snapshot ${{ github.event.pull_request.head.sha }} ${{ github.event.pull_request.base.sha }} ${{ github.base_ref }}
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make Gradle wrapper executable
        run: chmod +x backend/gradlew

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run repository checks
        run: npm run check

      - name: Install Chromium for browser tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify product lookup and decision lifecycle in browser
        run: npm --prefix frontend run test:e2e

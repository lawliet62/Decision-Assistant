name: Stacked PR restack

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'register: 등록, reconcile: 복구/상태 갱신, dry-run: 원격 변경 없이 검증'
        type: choice
        options: [dry-run, register, reconcile]
        default: dry-run
      prs:
        description: 'register 또는 등록 dry-run의 PR 번호 (기반 순서, 예: 21,22,23)'
        type: string
        required: false

permissions:
  contents: read

# A canceled pending run is recovered by the next full reconciliation, including the schedule.
concurrency:
  group: stacked-pr-restack
  cancel-in-progress: false

jobs:
  restack:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.RESTACK_ENABLED == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    environment: restack
    timeout-minutes: 30
    steps:
      # Never check out a PR, download its artifacts, or run its scripts with App credentials.
      - name: 보호된 main의 자동화 코드 읽기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Node.js 준비
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 이 저장소 전용 App token 발급
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RESTACK_APP_CLIENT_ID }}
          private-key: ${{ secrets.RESTACK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
          permission-actions: read
      - name: stack 등록 또는 전체 상태 조정
        run: node scripts/restack/main.mjs
        env:
          RESTACK_ACTION: ${{ inputs.action || 'reconcile' }}
          RESTACK_PRS: ${{ inputs.prs }}
          RESTACK_ENABLED: ${{ vars.RESTACK_ENABLED }}
          RESTACK_APP_ID: ${{ vars.RESTACK_APP_ID }}
          RESTACK_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          RESTACK_TOKEN: ${{ steps.app.outputs.token }}

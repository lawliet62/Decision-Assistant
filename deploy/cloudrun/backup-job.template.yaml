# 백업 Cloud Run Job 정의 template. 운영자가 render해 `gcloud run jobs replace`로 적용한다.
# backup/Dockerfile image가 운영 DB를 pg_dump -Fc로 받아 비공개 bucket의 backups/neon/에 새 object로 올린다.
# DB 비밀번호는 Secret Manager의 db-password를 숫자 version으로 고정해 env로 주입한다(latest 금지).
# 따옴표 안의 대문자 placeholder는 README의 render 절차(envsubst)로 채운다. render 결과는 저장소 밖에만 만든다.
# 시험용 endpoint 변경 env(BACKUP_TEST_ENDPOINTS 등)는 넣지 않는다. 이 주석에는 placeholder 표기를 쓰지 않는다.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: decision-assistant-backup
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: '${RUNTIME_SERVICE_ACCOUNT}'
          # 재시도는 새 시각의 새 object를 만들고 기존 object를 덮어쓰지 않는다. 일시 오류에 한 번만 재시도한다.
          maxRetries: 1
          timeoutSeconds: 900
          containers:
            - name: backup
              image: '${BACKUP_IMAGE}'
              env:
                - { name: PGHOST, value: '${NEON_HOST}' }
                - { name: PGDATABASE, value: decision_assistant }
                - { name: PGUSER, value: '${DB_USERNAME}' }
                - { name: PGSSLMODE, value: require }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: db-password, key: '${DB_SECRET_VERSION}' }
                - { name: BACKUP_BUCKET, value: '${BACKUP_BUCKET}' }
              resources:
                limits: { cpu: '1', memory: 512Mi }
